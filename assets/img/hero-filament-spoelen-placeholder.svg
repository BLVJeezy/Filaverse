<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Smart Print filament assortiment met PLA, PLA+ en PETG">
  <title>Smart Print filament assortiment bij Filaverse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="0.55" stop-color="#eef7f6"/>
      <stop offset="1" stop-color="#fff5ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10233d" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cardA"><rect x="78" y="166" width="350" height="350" rx="28"/></clipPath>
    <clipPath id="cardB"><rect x="330" y="70" width="500" height="500" rx="34"/></clipPath>
    <clipPath id="cardC"><rect x="784" y="184" width="330" height="330" rx="28"/></clipPath>
  </defs>
  <rect width="1200" height="740" rx="38" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="90" fill="#e8622a" opacity="0.08"/>
  <circle cx="152" cy="610" r="120" fill="#2f9e8f" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="78" y="166" width="350" height="350" rx="28" fill="#fff"/>
    <image href="https://b2b.smartprint24.com/_data/products/fg-s46-e1fg-s46-e1.jpg" x="78" y="166" width="350" height="350" preserveAspectRatio="xMidYMid meet" clip-path="url(#cardA)"/>
    <rect x="330" y="70" width="500" height="500" rx="34" fill="#fff"/>
    <image href="https://b2b.smartprint24.com/_data/products/fg-s79-e1fg-s79-e1.jpg" x="330" y="70" width="500" height="500" preserveAspectRatio="xMidYMid meet" clip-path="url(#cardB)"/>
    <rect x="784" y="184" width="330" height="330" rx="28" fill="#fff"/>
    <image href="https://b2b.smartprint24.com/_data/products/fg-s202-e1fg-s202-e1.jpg" x="784" y="184" width="330" height="330" preserveAspectRatio="xMidYMid meet" clip-path="url(#cardC)"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700">
    <rect x="112" y="542" width="210" height="44" rx="22" fill="#10233d"/>
